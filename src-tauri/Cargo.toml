[package]
name = "celah"
version = "0.1.0"
license = "MIT"
description = "Bibliometric analysis and research gap finder"
edition = "2021"
rust-version = "1.85"

[lib]
name = "celah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
reqwest = { version = "0.13", features = ["json", "query"] }
thiserror = "2"
csv = "1.4"
roxmltree = "0.21"
tokio = { version = "1", features = ["time"] }
tauri-plugin-dialog = "2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
